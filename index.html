<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <h2>Personal Information</h2>

    <label>Full Name:</label>
    <input type="text">

    <br><br>

    <label>Phone Number:</label>
    <input type="tel">

    <br><br>

    <label>Email:</label>
    <input type="email">

    <br><br>

    <label>Date of Birth:</label>
    <input type="date">

    <br><br>

    <label>Password:</label>
    <input type="password">

    <h2>Gender</h2>

    <input type="radio" name="gender" value="male">
    <label>Male</label>

    <input type="radio" name="gender" value="female">
    <label>Female</label>

    <input type="radio" name="gender" value="other">
    <label>Other</label>

    <h2>Course</h2>

    <select>
        <option>BCA</option>
        <option>B.Com</option>
        <option>BBA</option>
    </select>

    <h2>Subjects</h2>

    <input type="checkbox">
    <label>HTML</label>

    <input type="checkbox">
    <label>Java</label>

    <input type="checkbox">
    <label>Python</label>

    <input type="checkbox">
    <label>SQL</label>

    <h2>Address</h2>

    <textarea rows="5" cols="40"></textarea>

    <h2>Upload Document</h2>

    <input type="file">

    <br><br>

    <input type="submit" value="Register">

    <input type="reset" value="Clear">

</body>

</html>
